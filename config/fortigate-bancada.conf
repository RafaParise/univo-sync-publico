# Modelo de configuração da Bancada-Sync para o FortiGate 60D.
# Revisado a partir de docs/plano-mestre-provisionamento.md (o que mudou está em docs/decisoes-provisionamento.md).
#
# Cada "### SECAO nome" é aplicada nesta ordem. Marcas depois do nome:
#   min=X.Y   só aplica se o FortiOS for X.Y ou mais novo; senão pula e avisa
#   opcional  se o FortiOS recusar, desfaz o bloco atual, avisa e segue;
#             sem essa marca o script PARA no erro
#   reboot    reinicia o aparelho depois da seção
# ${NOME} vem do arquivo .env (modelo em .env.example).
# Linhas que começam com # são comentários e não vão para o aparelho.
# Pode rodar de novo: cada "edit" sobrescreve o que já existe.

### SECAO admin opcional
# Garante a senha do admin (o login de fábrica é sem senha).
config system admin
edit "admin"
set password "${ADMIN_SENHA}"
next
end

### SECAO modo-interface reboot
# Separa as portas 1 a 7, que de fábrica formam um switch só ("internal").
# Antes apaga as regras e o DHCP de fábrica, que usam o "internal".
# O script pula esta seção se o aparelho já estiver em modo interface.
config firewall policy
purge
end
config system dhcp server
purge
end
config system global
set hostname "FG60D-BANCADA"
set internal-switch-mode interface
end

### SECAO interfaces
config system interface
edit "wan1"
set mode dhcp
set allowaccess ping
next
edit "wan2"
set mode dhcp
set allowaccess ping
next
edit "internal1"
set ip 10.0.20.1 255.255.255.0
set allowaccess ping https ssh
next
edit "internal2"
set ip 10.0.30.1 255.255.255.0
set allowaccess ping
next
edit "dmz"
set ip 10.0.10.1 255.255.255.0
set allowaccess ping https
next
end

### SECAO dns-local
# O FortiGate responde DNS nas três redes e conhece nomes da bancada.
config system dns-server
edit "internal1"
set mode recursive
next
edit "internal2"
set mode recursive
next
edit "dmz"
set mode recursive
next
end
config system dns-database
edit "bancada"
set domain "bancada.lan"
set authoritative disable
config dns-entry
edit 1
set hostname "fortigate"
set ip 10.0.20.1
next
edit 2
set hostname "arena"
set ip 10.0.20.100
next
edit 3
set hostname "a12"
set ip 10.0.10.50
next
end
next
end

### SECAO dhcp
config system dhcp server
edit 1
set interface "internal1"
set default-gateway 10.0.20.1
set netmask 255.255.255.0
set dns-service local
config ip-range
edit 1
set start-ip 10.0.20.50
set end-ip 10.0.20.150
next
end
config reserved-address
edit 1
set ip 10.0.20.100
set mac ${MAC_RYZEN}
next
end
next
edit 2
set interface "dmz"
set default-gateway 10.0.10.1
set netmask 255.255.255.0
set dns-service local
config ip-range
edit 1
set start-ip 10.0.10.50
set end-ip 10.0.10.50
next
end
config reserved-address
edit 1
set ip 10.0.10.50
set mac ${MAC_A12}
next
end
next
edit 3
set interface "internal2"
set default-gateway 10.0.30.1
set netmask 255.255.255.0
set dns-service local
config ip-range
edit 1
set start-ip 10.0.30.10
set end-ip 10.0.30.150
next
end
next
end

### SECAO reserva-controle-arena opcional
# Só roda se MAC_CONTROLE_1 estiver preenchido no .env.
config system dhcp server
edit 3
config reserved-address
edit 1
set ip 10.0.30.10
set mac ${MAC_CONTROLE_1}
next
end
next
end

### SECAO objetos
config firewall address
edit "PC_RYZEN"
set subnet 10.0.20.100 255.255.255.255
next
edit "A12_PARISE_CORE"
set subnet 10.0.10.50 255.255.255.255
next
edit "ARENA_CONTROLES"
set subnet 10.0.30.0 255.255.255.0
next
end
config firewall service custom
edit "ADB_5555"
set tcp-portrange 5555
next
edit "ARENA_WEBSOCKET"
set tcp-portrange 8080
next
edit "A12_SAUDE_API"
set tcp-portrange 8000
next
edit "TERMUX_SSH"
set tcp-portrange 8022
next
end

### SECAO qos
config firewall shaper traffic-shaper
edit "ARENA_INPUT_SHAPER"
set guaranteed-bandwidth 5000
set maximum-bandwidth 10000
set priority high
next
edit "OBS_UPLOAD_SHAPER"
set maximum-bandwidth 20000
set priority medium
next
end

### SECAO politicas
# A ordem de criação é a ordem de avaliação.
config firewall policy
edit 1
set name "PC_PARA_INTERNET"
set srcintf "internal1"
set dstintf "wan1"
set srcaddr "PC_RYZEN"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
set nat enable
next
edit 2
set name "PC_PARA_A12_ADB"
set srcintf "internal1"
set dstintf "dmz"
set srcaddr "PC_RYZEN"
set dstaddr "A12_PARISE_CORE"
set action accept
set schedule "always"
set service "ADB_5555"
set logtraffic all
next
edit 3
set name "PC_PARA_A12_GERENCIA"
set srcintf "internal1"
set dstintf "dmz"
set srcaddr "PC_RYZEN"
set dstaddr "A12_PARISE_CORE"
set action accept
set schedule "always"
set service "A12_SAUDE_API" "TERMUX_SSH" "PING"
next
edit 4
set name "ARENA_CONTROLES_PARA_PC"
set srcintf "internal2"
set dstintf "internal1"
set srcaddr "ARENA_CONTROLES"
set dstaddr "PC_RYZEN"
set action accept
set schedule "always"
set service "ARENA_WEBSOCKET" "PING"
set traffic-shaper "ARENA_INPUT_SHAPER"
set diffserv-forward enable
set diffservcode-forward 101110
next
edit 5
set name "A12_PARA_INTERNET"
set srcintf "dmz"
set dstintf "wan1"
set srcaddr "A12_PARISE_CORE"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
set nat enable
set logtraffic all
next
end

### SECAO bloqueio-telemetria opcional
# Bloqueia *.samsung.net no DNS do FortiGate para a DMZ (filtro local, sem FortiGuard).
# [Palpite] a sintaxe exata no FortiOS do 60D; por isso é opcional.
config dnsfilter domain-filter
edit 1
set name "TELEMETRIA_SAMSUNG"
config entries
edit 1
set domain "*.samsung.net"
set type wildcard
set action block
next
end
next
end
config dnsfilter profile
edit "BLOQUEIA_TELEMETRIA"
config domain-filter
set domain-filter-table 1
end
next
end
config system dns-server
edit "dmz"
set dnsfilter-profile "BLOQUEIA_TELEMETRIA"
next
end

### SECAO logs opcional
config log syslogd setting
set status enable
set server "10.0.20.100"
end

### SECAO netflow min=6.2 opcional
config system netflow
set collector-ip 10.0.20.100
set collector-port 2055
end

### SECAO api-parise-core opcional
# Usuário de API só com permissão de firewall e só aceito a partir do A12.
# A chave é gerada no aparelho depois desta seção e gravada no .env.
config system accprofile
edit "parise_core_api"
set fwgrp read-write
next
end
config system api-user
edit "claude_parise_core"
set accprofile "parise_core_api"
config trusthost
edit 1
set ipv4-trusthost 10.0.10.50 255.255.255.255
next
end
next
end
